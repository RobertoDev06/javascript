<body>

    <script>
        var n1 = Number.parseInt(window.prompt ('Digite um número: '))
        var n2 = Number.parseInt(window.prompt ('Digite um número: ')) // prompt sempre irá receber o valor de String 
        var s = n1 + n2
        window.alert("A soma dos valores é " + String(s)) // Concatenar
        // (number + number) para a adição
        // (string + string) para concatenação, Prompt sempre irá receber o valor de String 

        var n3 = Number.parseInt(window.prompt ('Digite um número: '))
        var n4 = Number.parseInt(window.prompt ('Digite um número: ')) // prompt sempre irá receber o valor de String 
        var s2 = n3 + n4
        window.alert(`A soma entre ${n3} e ${n4} é igual a ${s2}`)
