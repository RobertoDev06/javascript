<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores</title>
</head>
<body>
    <script>
        // Soma //

        var n1 = Number.parseInt(window.prompt('Digite o primeiro numero: '))
        var n2 = Number.parseInt(window.prompt('Digite o segundo valor: '))
        var soma1 = n1 + n2
        window.alert("O resultado é " + soma1)

        // Subtração //

        var n3 = Number.parseInt(window.prompt('Digite o terceiro numero: '))
        var n4 = Number.parseInt(window.prompt('Digite o quarto valor: '))
        var soma2 = n3 - n4
        window.alert("O resultado é " + soma2)

        // Multiplicação //

        var n5 = Number.parseInt(window.prompt('Digite o quinto numero: '))
        var n6 = Number.parseInt(window.prompt('Digite o sexto valor: '))
        var soma3 = n5 * n6
        window.alert("O resultado é " + soma3)

        // Divisão //

        var n7 = Number.parseInt(window.prompt('Digite o sétimo numero: '))
        var n8 = Number.parseInt(window.prompt('Digite o oitavo valor: '))
        var soma4 = n7 / n8
        window.alert("O resultado é " + soma4)

        // Resto de Divisão //

        var n9 = Number.parseInt(window.prompt('Digite o nono numero: '))
        var n10 = Number.parseInt(window.prompt('Digite o décimo valor: '))
        var soma5 = n9 % n10
        window.alert("O resultado é " + soma5)

        // Raiz Quadrada //

        var n11 = Number.parseInt(window.prompt('Digite um numero para calcular a raiz quadrada: '))
        var soma6 = n11 ** 2
        window.alert("O resultado é " + soma6)
</script>

</body>
</html>
