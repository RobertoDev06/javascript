<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Somando Números</title>
    <style>
        body, input {
            font: normal 18pt arial;
        }
        input {
            width: 100px;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <h1>Somando Valores</h1>

    <input type="number" name="txtn1" id="txtn1"> +
    <input type="number" name="txtn2" id="txtn2">
    <input type="button" value="Somar" onclick="somar()">

    <div id="res">Resultado</div>

    <script>
        function somar() {

            let inputNumero1 = document.getElementById('txtn1') // Primeiro campo de número
            let inputNumero2 = document.querySelector('input#txtn2') // Segundo campo de número
            let divResultado = document.getElementById('res') // Área onde aparece o resultado

            let numero1 = Number(inputNumero1.value) // Converte o valor do primeiro input para número
            let numero2 = Number(inputNumero2.value) // Converte o valor do segundo input para número

            let resultadoSoma = numero1 + numero2 // Faz a soma dos dois números

            divResultado.innerHTML = `A soma entre ${numero1} e ${numero2} é igual a <strong>${resultadoSoma}</strong>` // Mostra o resultado na tela
        }
    </script>

</body>
</html>
