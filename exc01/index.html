<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(127, 208, 255);
            font: normal 20pt arial 
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição!!</p>
    <script>

        window.alert('Minha primeira mensagem') // Exibe uma janela de alerta com uma mensagem (apenas OK)

        window.confirm('Está gostando de JS?') // Exibe uma janela de confirmação com OK e Cancelar
         // Retorna true (OK) ou false (Cancelar)

        window.prompt('Qual é o seu nome?') // Exibe uma janela para o usuário digitar um valor
        // Retorna o texto digitado pelo usuário


    </script>
</body>
</html>
